server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # www.gimfreires.tech -> gimfreires.tech (um endereço só para o Google)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # imagens, vídeo, css e js: cache de 30 dias no navegador
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|mp4|css|js|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
